<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ちょっと不思議なお寺からの脱出" />
  <link rel="icon" href="favicon.ico" />
  <title>ちょっと不思議なお寺からの脱出</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: "Arial", sans-serif;
      background: linear-gradient(135deg, #2c1810, #1a0f08);
      color: #f4f1e8;
      width: 100%;
      overflow-x: hidden;
      /* ←これ重要 */
    }

    .game-container {
      width: 100%;
      max-width: 1408px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    #gameCanvas {
      position: relative;
    }



    #endingShareArea {
      position: absolute;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      box-shadow: 0 0 24px #fffc;
      padding: 18px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 99;
      font-size: 1.2em;
      gap: 10px;
      border: 2px solid gold;
    }

    #endingShareArea button {
      font-size: 1.1em;
      padding: 10px 24px;
      margin: 6px 0;
      background: gold;
      color: #333;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      box-shadow: 0 2px 8px #ffdc;
      cursor: pointer;
    }

    .ui-panel {
      flex-wrap: wrap;
      width: 100%;
      max-width: 1048px;
      min-height: 120px;
      background: #2c1810;
      box-sizing: border-box;
      display: flex;
      align-items: flex-start;
    }

    .inventory {
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
      padding: 0 12px;
      flex-wrap: nowrap;
      max-width: 720px;
      margin: 0 auto;
      margin-top: 6px;
    }

    .inventory-shell {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 0 8px;
      box-sizing: border-box;
    }

    .inventory-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .inventory-nav {
      width: 44px;
      height: 44px;
      border: 2px solid #d4af37;
      border-radius: 10px;
      background: linear-gradient(180deg, #4a2a18, #241208);
      color: #f8e4a2;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .inventory-nav:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .inventory-slot {
      width: 80px;
      height: 80px;
      max-width: 80px;
      max-height: 80px;
      border: 2px solid #d4af37;
      background: rgba(212, 175, 55, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .inventory-slot:hover {
      background: rgba(212, 175, 55, 0.2);
      transform: scale(1.05);
    }

    .inventory-slot.selected {
      border: 3px solid #9f2b02;
      /* 金色・太め推奨 */
      box-shadow: 0 0 12px #ff8c0099;
      background: rgba(255, 215, 0, 0.15);
    }

    .inventory-slot.inventory-flash {
      animation: inventoryCardFlash 0.7s ease-out 1;
    }

    @keyframes inventoryCardFlash {
      0% {
        box-shadow:
          0 0 0 rgba(255, 238, 128, 0),
          inset 0 0 0 rgba(255, 238, 128, 0);
        background: rgba(212, 175, 55, 0.1);
      }

      25% {
        box-shadow:
          0 0 22px rgba(255, 238, 128, 0.98),
          inset 0 0 18px rgba(255, 238, 128, 0.58);
        background: rgba(255, 238, 128, 0.32);
      }

      100% {
        box-shadow:
          0 0 0 rgba(255, 238, 128, 0),
          inset 0 0 0 rgba(255, 238, 128, 0);
        background: rgba(212, 175, 55, 0.1);
      }
    }

    .inventory-slot img {
      max-width: 60px;
      max-height: 60px;
      object-fit: contain;
    }

    .inventory-selected {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 34px;
      padding: 4px 8px;
      border: 1px solid rgba(212, 175, 55, 0.7);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.28);
    }

    .inventory-selected-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .inventory-selected-thumb {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(212, 175, 55, 0.7);
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      overflow: hidden;
    }

    .inventory-selected-thumb img {
      max-width: 22px;
      max-height: 22px;
      object-fit: contain;
    }

    .inventory-selected-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
    }

    .inventory-selected-label {
      font-size: 10px;
      line-height: 1;
      color: #e8cc75;
      opacity: 0.92;
    }

    .inventory-selected-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      color: #f8f3de;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inventory-selected-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .inventory-selected-btn {
      min-width: 50px;
      height: 28px;
      padding: 0 10px;
      border: 1px solid rgba(212, 175, 55, 0.85);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(74, 42, 24, 0.95), rgba(36, 18, 8, 0.95));
      color: #f8e4a2;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .inventory-selected-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .magnifier-btn {
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px #0002;
      cursor: pointer;
      z-index: 10;
      transition: box-shadow 0.15s;
    }

    .magnifier-btn:hover {
      box-shadow: 0 0 10px #ffd70099;
    }

    .magnifier-btn img {
      width: 16px;
      height: 16px;
      pointer-events: none;
    }

    .info-panel {
      width: 100%;
      padding: 2px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 8px;
    }

    .message-area {
      background: rgba(0, 0, 0, 0.8);
      padding: 5px;
      border-radius: 5px;
      margin-bottom: 2px;
      height: 65px;
      min-height: 40px;
      border: 1px solid #d4af37;
      position: relative;
    }

    #statusIconArea {
      position: absolute;
      bottom: 6px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }


    .navigation {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .nav-btn {
      padding: 8px 16px;
      background: linear-gradient(135deg, #d4af37, #b8941f);
      border: none;
      border-radius: 5px;
      color: #1a0f08;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: linear-gradient(135deg, #b8941f, #d4af37);
      transform: translateY(-2px);
    }

    .nav-btn:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: linear-gradient(135deg, #2c1810, #1a0f08);
      padding: 30px;
      border-radius: 10px;
      border: 3px solid #d4af37;
      /*  max-width: calc(100vw - 60px); */
      text-align: center;
      max-width: min(96vw, 640px);
      max-height: calc(100vh - 64px);
      /* 画面に収める */
      overflow: auto;
      /* はみ出したらスクロール */
      padding: 20px;
      /* ちょい圧縮 */
    }


    .modal-top-close-bar {
      position: sticky;
      top: -20px;
      z-index: 20;
      display: flex;
      justify-content: flex-end;
      margin: -20px -20px 0;
      padding: 4px 8px;
      background: #24140d;
    }

    #modalContent .modal-top-close {
      min-width: 44px;
      min-height: 44px;
      margin: 0;
      padding: 8px 12px;
      font-size: 16px;
      touch-action: manipulation;
    }


    .modal-content.amulet-guide-modal {
      box-sizing: border-box;
      width: min(94vw, 540px);
      color: #483421;
      border: 1px solid #aa8b5d;
      border-radius: 4px;
      background: linear-gradient(135deg, #fffbef, #eee0bf);
      box-shadow: inset 0 0 22px #9a6f2926, 0 8px 24px #0006;
    }

    .amulet-guide-modal .modal-top-close-bar {
      background: #f6ebd3;
    }

    .amulet-guide-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding: 0;
      margin: 0;
      border-top: 1px solid #b49a73;
      border-left: 1px solid #b49a73;
      list-style: none;
      font-size: clamp(12px, 3.5vw, 17px);
      font-weight: bold;
    }

    .amulet-guide-grid li {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-height: 4em;
      padding: 6px 2px;
      border-right: 1px solid #b49a73;
      border-bottom: 1px solid #b49a73;
    }

    .showobj-image {
      display: block;
      width: auto;
      height: auto;
      max-width: min(92vw, 560px);
      max-height: min(72vh, 460px);
      margin: 0 auto 20px;
      object-fit: contain;
    }

    .blessing-icon {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid #d4af37;
      border-radius: 50%;
      background: #302510;
      color: #ffe28a;
    }

    .ticket-machine-number {
      display: inline-flex;
      align-items: flex-start;
      gap: 8px;
    }

    .ticket-machine-base,
    .ticket-machine-exponent {
      display: flex;
      gap: 4px;
    }

    .ticket-machine-base {
      margin-top: 28px;
    }

    #modalContent .ticket-machine-number button {
      width: clamp(48px, 16vw, 68px);
      aspect-ratio: 1;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #222;
      font-size: 2rem;
    }

    #modalContent .ticket-machine-exponent button {
      width: 44px;
      font-size: 1.25rem;
    }

    #ticketMachineFeedback {
      min-height: 1.5em;
      margin: 8px 0;
    }

    .storage-door-sign {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .storage-door-symbols {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 8px;
      width: min(272px, 75vw);
      margin: 0 auto;
    }

    #modalContent .storage-door-symbols button {
      aspect-ratio: 1;
      margin: 0;
      padding: 0;
      border: 1px solid #888;
      border-radius: 0;
      background: #fff;
      color: #222;
      font-size: clamp(24px, 7vw, 36px);
    }

    .inner-well-chest-lock {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr) auto) minmax(0, 1fr);
      align-items: center;
      gap: clamp(3px, 1vw, 8px);
      width: min(400px, 100%);
      margin: 0 auto;
    }

    #modalContent .inner-well-chest-lock button {
      aspect-ratio: 1;
      min-width: 0;
      margin: 0;
      padding: 2px;
      border: 1px solid #888;
      background: #fff;
    }

    .inner-well-chest-lock img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .counter-storage-bars {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: clamp(4px, 1.5vw, 8px);
      width: min(320px, 75vw);
      margin: 0 auto;
    }

    #modalContent .counter-storage-bars button {
      display: flex;
      align-items: flex-end;
      aspect-ratio: 1 / 2.4;
      margin: 0;
      padding: 0;
      border: 1px solid #888;
      border-radius: 0;
      background: #fff;
    }

    .counter-storage-bars span {
      width: 100%;
      height: 33%;
      background: #888;
    }

    .counter-storage-bars [data-level="1"] span {
      height: 66%;
    }

    .counter-storage-bars [data-level="2"] span {
      height: 100%;
    }

    #storageDoorFeedback,
    #counterStorageFeedback {
      min-height: 1.5em;
      margin: 8px 0;
    }

    .modal-anim {
      display: grid;
      width: min(400px, 80vw, 65vh);
      margin: 0 auto 16px;
    }

    .modal-anim img {
      grid-area: 1 / 1;
      display: block;
      width: 100%;
    }

    .modal-anim img+img {
      animation: modal-anim-fade-in 0.7s ease 0.6s both;
    }

    .modal-anim img:nth-child(3) {
      animation-delay: 1.9s;
    }

    @keyframes modal-anim-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .modal-anim img+img {
        animation: none;
      }

      .modal-anim img:not(:last-child) {
        visibility: hidden;
      }
    }

    @media (min-width: 769px) {
      .modal-content.showobj-modal {
        max-width: min(96vw, 700px);
      }

      .showobj-modal .showobj-image {
        max-width: min(88vw, 640px);
        max-height: min(78vh, 540px);
      }
    }

    /* 短冊をクリックしたときの和紙風モーダル */

    .modal button {
      margin: 10px;
      padding: 10px 20px;
      background: #d4af37;
      border: none;
      border-radius: 5px;
      color: #1a0f08;
      cursor: pointer;
      font-weight: bold;
    }

    #lanternMemo,
    #incenseBurnerZoom,
    #cameraRobotPhoto {
      display: block;
      margin: 0 auto;
      padding: 0;
      background: transparent;
      cursor: zoom-in;
    }

    #lanternMemo img,
    #incenseBurnerZoom img,
    #cameraRobotPhoto img {
      margin: 0;
    }

    #modalButtons button {
      border: none;
      background: none;
      padding: 0;
      margin: 0 10px 10px 0;
      cursor: pointer;
      transition:
        filter 0.1s,
        box-shadow 0.1s,
        transform 0.08s;
      border-radius: 10px;
    }

    #modalButtons button img {
      width: 80px;
      height: 80px;
      vertical-align: middle;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition:
        filter 0.1s,
        box-shadow 0.1s,
        transform 0.08s;
    }

    #modalButtons button:hover img {
      filter: brightness(1.08) drop-shadow(0 2px 6px #ffd70050);
      box-shadow: 0 0 10px #ffd70080;
      transform: scale(1.05);
    }

    #modalButtons button:active img,
    #modalButtons button.pressed img {
      filter: brightness(0.95) grayscale(20%);
      box-shadow: 0 0 8px #3332;
      transform: scale(0.97);
    }

    #modalButtons button:disabled img {
      filter: grayscale(90%) opacity(0.5);
      box-shadow: none;
    }

    /* テキスト型ボタンも画像ボタン風に */
    #modalButtons button.text-btn {
      min-width: 120px;
      font-size: 1.15em;
      background: linear-gradient(90deg, #ffe259 0%, #ffa751 100%);
      color: #7b4a00;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 15px 32px;
      margin: 0 10px 10px 0;
      box-shadow: 0 4px 14px #ffc90022;
      cursor: pointer;
      transition:
        background 0.12s,
        filter 0.1s,
        box-shadow 0.1s,
        transform 0.08s;
      vertical-align: middle;
      display: inline-block;
    }

    #modalButtons button.text-btn:hover {
      background: linear-gradient(90deg, #ffea85 0%, #ffc371 100%);
      filter: brightness(1.08);
      box-shadow: 0 6px 20px #ffc90055;
      transform: scale(1.05);
    }

    #modalButtons button.text-btn:active {
      filter: brightness(0.96);
      transform: scale(0.97);
    }

    #modalButtons button.text-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 閉じるボタン */
    #modalClose .modal-close-btn {
      display: inline-block;
      min-width: 160px;
      font-size: 1.2em;
      background: linear-gradient(90deg, #ffe259 0%, #ffa751 100%);
      color: #7b4a00;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 15px 32px;
      box-shadow: 0 4px 14px #ffc90022;
      margin-top: 10px;
      cursor: pointer;
      transition:
        background 0.12s,
        filter 0.1s,
        box-shadow 0.1s;
    }

    #modalClose .modal-close-btn:hover {
      background: linear-gradient(90deg, #ffea85 0%, #ffc371 100%);
      filter: brightness(1.08);
      box-shadow: 0 6px 20px #ffc90055;
    }

    .modal button.ok-btn {
      margin-top: 8px;
      font-size: 1.4rem;
      background-color: #1d9fff;
      color: #fff;
    }

    .modal button.ok-btn:hover {
      background-color: #1789da;
    }


    .image-placeholder {
      background: linear-gradient(135deg, #444, #666);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font-size: 14px;
      text-align: center;
      border-radius: 5px;
    }

    .notice {
      text-overflow: clip;
    }

    .save-area {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 18px 0 4px 0;
      align-self: flex-start;
    }

    @media (max-width: 600px) {
      #msgText {
        font-size: 0.8rem;
      }

      .save-area {
        width: 100%;
        max-width: 100%;
        margin-left: 0;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        margin-top: 8px;
        gap: 16px;
      }

      .inventory {
        gap: 6px;
        align-items: center;
        padding: 0;
        width: auto;
        max-width: none;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        justify-content: center;
      }

      .inventory-slot {
        width: clamp(42px, 10.5vw, 52px);
        height: clamp(42px, 10.5vw, 52px);
        min-width: 0;
        min-height: 0;
      }

      .inventory-slot img {
        max-width: 72%;
        max-height: 72%;
      }

      .inventory-shell {
        gap: 4px;
        padding: 0 4px;
      }

      .inventory-main {
        gap: 6px;
      }

      .inventory-nav {
        width: 38px;
        height: 38px;
        font-size: 20px;
      }

      .magnifier-btn {
        display: none;
      }

      .magnifier-btn img {
        width: 11px;
        height: 11px;
      }

      .inventory-selected {
        min-height: 30px;
        padding: 3px 6px;
        gap: 6px;
      }

      .inventory-selected-thumb {
        width: 24px;
        height: 24px;
      }

      .inventory-selected-thumb img {
        max-width: 18px;
        max-height: 18px;
      }

      .inventory-selected-label {
        font-size: 9px;
      }

      .inventory-selected-name {
        font-size: 11px;
      }

      .inventory-selected-actions {
        gap: 4px;
      }

      .inventory-selected-btn {
        min-width: 42px;
        height: 24px;
        padding: 0 8px;
        font-size: 11px;
      }
    }

    @media (min-width: 601px) {
      .ui-panel {
        align-items: center;
      }

      .inventory-shell {
        width: auto;
        flex: 1 1 auto;
        justify-content: flex-start;
        gap: 4px;
        padding: 0 0 0 4px;
      }

      .inventory-main {
        justify-content: flex-start;
        gap: 6px;
      }

      .inventory {
        display: flex;
        gap: 16px;
        justify-content: flex-start;
        align-items: center;
        max-width: 672px;
        margin: 0;
        padding: 0 6px;
      }

      .save-area {
        margin: 0 0 0 10px;
        align-self: center;
        align-items: center;
        flex: 0 0 auto;
      }
    }

    .save-area .nav-btn {
      min-width: 80px;
      padding: 10px 18px;
      font-size: 15px;
      background: linear-gradient(135deg, #d4af37 85%, #b8941f 100%);
      border-radius: 8px;
      border: none;
      color: #1a0f08;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.1);
      transition:
