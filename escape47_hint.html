<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>列車からの脱出 - 作品ガイド</title>
  <meta name="description" content="列車からの脱出の遊び方とヒント。スマホ・PC対応。" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    /* ===== index.htmlのトーンに合わせた軽量スタイル ===== */
    :root {
      --bg: #f7f4ef;
      /* 背景（indexと同系） */
      --ink: #222;
      /* 文字色 */
      --ink-sub: #5a4c33;
      /* サブ文字色 */
      --gold: #d4af37;
      /* ゴールド */
      --gold-2: #b8941f;
      /* 濃いめゴールド */
      --card-grad: linear-gradient(135deg, #fffbe8 70%, #faebd7 100%);
      --shadow: 0 8px 24px #b8941f44;
      --radius: 18px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family:
        Arial,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        Meiryo,
        sans-serif;
    }

    .wrap {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 16px;
    }

    h1 {
      text-align: center;
      letter-spacing: 2px;
      margin: 24px auto 8px;
      max-width: 90%;
      font-size: clamp(1.6rem, 2.8vw, 2.2rem);
    }

    .subtitle {
      text-align: center;
      color: var(--ink-sub);
      margin-bottom: 22px;
      font-size: 0.98rem;
    }

    .card {
      background: var(--card-grad);
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px #d4af3720;
      padding: 18px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 18px;
    }

    .thumb {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
      border: 1.5px solid var(--gold);
      background: #eee;
    }

    .meta {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-size: 0.85rem;
      color: #1a0f08;
      background: #fff5d6;
      border: 1px solid var(--gold);
      padding: 4px 8px;
      border-radius: 999px;
    }

    .desc {
      color: var(--ink-sub);
      line-height: 1.7;
    }

    .specs {
      display: grid;
      gap: 6px;
      color: #3b2f1e;
      font-size: 0.96rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      background: linear-gradient(135deg, var(--gold) 80%, var(--gold-2) 100%);
      color: #1a0f08;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 1px 4px #b8941f33;
      transition:
        transform 0.12s,
        filter 0.12s;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(0.98);
    }

    .btn.secondary {
      background: #fff;
      color: #1a0f08;
      border: 1.5px solid var(--gold);
    }

    .panel {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      border: 1.5px dashed var(--gold-2);
      background: #fffdf5;
    }

    .panel h3 {
      margin: 0 0 8px 0;
      font-size: 1.05rem;
    }

    .list {
      margin: 6px 0 0 0;
      padding-left: 1.1em;
    }

    .list li {
      margin: 0.25em 0;
    }

    .footer {
      text-align: center;
      margin: 22px 0 6px 0;
    }

    .footer a {
      color: var(--gold-2);
      text-decoration: underline;
    }

    @media (max-width: 720px) {
      .card {
        grid-template-columns: 1fr;
      }

      .thumb {
        height: 36vw;
        min-height: 140px;
      }
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }

    .panel p {
      line-height: 1.8;
    }

    .hint {
      border-top: 1px solid #d4af3766;
      padding: 14px 0;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      line-height: 1.7;
    }

    summary:focus-visible {
      outline: 2px solid var(--gold-2);
      outline-offset: 4px;
    }

    .answer {
      margin-top: 12px;
      padding: 12px;
      background: #fff;
      border-radius: 8px;
    }

    .answer summary {
      color: var(--ink-sub);
    }

    .list li {
      line-height: 1.8;
    }
  </style>

</head>

<body>
  <main class="wrap">
    <h1>列車からの脱出</h1>
    <div class="subtitle">遊び方・ヒント</div>

    <!-- メインカード -->
    <section class="card">
      <img class="thumb" src="https://pub-40dbb77d211c4285aa9d00400f68651b.r2.dev/images/47/admin_door_front.webp"
        alt="列車内" />
      <div class="meta">
        <div class="tags">
          <span class="tag">短編</span>

          <span class="tag">分岐あり</span>
        </div>
        <p class="desc">列車内を探索し、降りる駅を見つけましょう。</p>
        <div class="specs">・END：2</div>
        <div class="actions">
          <a class="btn" href="escape47.html">▶ プレイする</a>
          <a class="btn secondary" href="index.html">← 作品一覧に戻る</a>

      </div>
    </section>

    <section class="panel">
      <h2>遊び方</h2>

        <li>気になる場所をクリック、またはタップして調べます。</li>
        <li>アイテムはクリックして選択し、使いたい場所をクリックします。詳細表示では専用の操作ができるものもあります。</li>
      </ul>
    </section>
    <section class="panel">
      <h2>ヒント</h2>
      <p></p>


    </section>
    <section class="panel">
      <h2>備考</h2>
      <ul class="list">
        <li></li>
      </ul>
    </section>

    <div class="footer">
      <a href="index.html">← 作品一覧へ戻る</a>
    </div>
  </main>
</body>

</html>
